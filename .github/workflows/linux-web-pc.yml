name: Linux Web PC

on:
  workflow_dispatch:
    inputs:
      vps_user:
        description: 'Usuário para identificar a sessão'
        required: true
        default: 'admin'
      vps_password:
        description: 'Senha para acessar o desktop pelo navegador'
        required: true

jobs:
  linux-web-pc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar desktop e ferramentas
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            xfce4 \
            xfce4-terminal \
            xfce4-goodies \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            tmate \
            wget \
            curl \
            dbus-x11

          wget -qO /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/google-chrome-stable_current_amd64.deb

          wget -qO /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Iniciar PC Linux no navegador
        env:
          VPS_USER: ${{ github.event.inputs.vps_user }}
          VPS_PASSWORD: ${{ github.event.inputs.vps_password }}
        run: |
          set -e

          Xvfb :99 -screen 0 1600x900x24 > /tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2

          dbus-launch --exit-with-session startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 10

          DISPLAY=:99 google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --start-maximized \
            > /tmp/chrome.log 2>&1 &
          sleep 3

          x11vnc -display :99 -forever -shared -rfbport 5900 \
            -passwd "$VPS_PASSWORD" -quiet > /tmp/x11vnc.log 2>&1 &
          sleep 3

          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6080/vnc.html > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent http://127.0.0.1:6080/vnc.html > /dev/null; then
            echo 'O noVNC não iniciou corretamente.'
            echo '--- Xvfb ---'
            cat /tmp/xvfb.log || true
            echo '--- XFCE ---'
            cat /tmp/xfce.log || true
            echo '--- Chrome ---'
            cat /tmp/chrome.log || true
            echo '--- x11vnc ---'
            cat /tmp/x11vnc.log || true
            echo '--- noVNC ---'
            cat /tmp/novnc.log || true
            exit 1
          fi

          cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo 'Não foi possível criar o endereço público.'
            cat /tmp/cloudflared.log
            exit 1
          fi

          ACCESS_URL="$URL/vnc.html?autoconnect=true&resize=scale"

          {
            echo '## Seu PC Linux está pronto'
            echo ''
            echo "**Link para acessar:** $ACCESS_URL"
            echo ''
            echo "**Usuário da sessão:** \`$VPS_USER\`"
            echo '**Senha VNC:** a que você definiu ao iniciar o workflow'
            echo ''
            echo 'Abra o link e digite a senha VNC quando solicitada.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '===================================================='
          echo 'SEU PC LINUX ESTÁ PRONTO'
          echo "LINK PARA ACESSAR: $ACCESS_URL"
          echo "USUÁRIO DA SESSÃO: $VPS_USER"
          echo 'SENHA VNC: a que você definiu ao iniciar o workflow'
          echo '===================================================='

          wait
