name: Linux Web PC

on:
  workflow_dispatch:
    inputs:
      vps_user:
        description: 'Usuário para identificar a sessão'
        required: false
        default: 'admin'

jobs:
  linux-web-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Preparar pasta persistente
        run: |
          mkdir -p "$HOME/persist"
          echo 'Salve seus arquivos em ~/persist para incluí-los no backup final.'

      - name: Instalar desktop e ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 xfce4-terminal xfce4-goodies \
            xvfb x11vnc novnc websockify \
            neofetch tmate wget curl dbus-x11

          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

          wget -qO /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Iniciar PC Linux no navegador
        env:
          VPS_USER: ${{ github.event.inputs.vps_user }}
        run: |
          set -e

          # Tarefa inútil em segundo plano:
          # roda por 5 minutos, para por 25 minutos e repete.
          (
            while true; do
              echo "[$(date)] Iniciando tarefa inútil..." >> "$HOME/persist/tarefa-inutil.log"

              fim=$((SECONDS + 300))

              while [ $SECONDS -lt $fim ]; do
                echo "[$(date)] Rodando tarefa inútil..." >> "$HOME/persist/tarefa-inutil.log"
                sleep 30
              done

              echo "[$(date)] Tarefa inútil finalizada. Aguardando 25 minutos..." >> "$HOME/persist/tarefa-inutil.log"
              sleep 1500
            done
          ) &

          Xvfb :99 -screen 0 1600x900x24 > /tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2

          dbus-launch --exit-with-session startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 10

          DISPLAY=:99 google-chrome --no-sandbox --disable-dev-shm-usage --start-maximized > /tmp/chrome.log 2>&1 &
          sleep 3

          x11vnc -display :99 -forever -shared -rfbport 5900 \
            -nopw -quiet > /tmp/x11vnc.log 2>&1 &

          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6080/vnc.html > /dev/null; then break; fi
            sleep 2
          done

          if ! curl --fail --silent http://127.0.0.1:6080/vnc.html > /dev/null; then
            echo 'O noVNC não iniciou corretamente.'
            exit 1
          fi

          cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo 'Não foi possível criar o endereço público.'
            cat /tmp/cloudflared.log
            exit 1
          fi

          ACCESS_URL="$URL/vnc.html?autoconnect=true&resize=scale"

          {
            echo '## Seu PC Linux está pronto'
            echo ''
            echo "**Link para acessar:** $ACCESS_URL"
            echo ''
            echo "**Usuário da sessão:** \`$VPS_USER\`"
            echo '**Acesso sem senha ativado. Qualquer pessoa com o link poderá acessar o desktop.**'
            echo ''
            echo '**Backup seguro:** salve seus arquivos em `~/persist`. Ao encerrar a execução, o backup aparecerá como artifact `linux-web-pc-backup`.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "LINK PARA ACESSAR: $ACCESS_URL"

          # Mantém o workflow ativo por 5 horas e 45 minutos.
          sleep 20700

      - name: Salvar arquivos persistentes como backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-web-pc-backup
          path: /home/runner/persist
          if-no-files-found: warn
          retention-days: 7
