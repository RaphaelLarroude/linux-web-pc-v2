name: Linux Mint Web Desktop

on:
  workflow_dispatch:
    inputs:
      vps_password:
        description: 'Senha para entrar no desktop pelo navegador'
        required: true

jobs:
  linux-mint-web-desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Docker e Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io curl wget
          sudo systemctl start docker

          wget -qO /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Iniciar Linux Mint XFCE no navegador
        env:
          DESKTOP_PASSWORD: ${{ github.event.inputs.vps_password }}
        run: |
          set -e

          sudo docker pull kasmweb/desktop:1.16.1
          sudo docker run -d \
            --name linux-mint-web-desktop \
            --shm-size="1gb" \
            --security-opt seccomp=unconfined \
            -e VNC_PW="$DESKTOP_PASSWORD" \
            -e VNC_RESOLUTION=1600x900 \
            -p 6901:6901 \
            --restart no \
            kasmweb/desktop:1.16.1

          for i in $(seq 1 60); do
            if curl --fail --silent --insecure https://127.0.0.1:6901/ > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent --insecure https://127.0.0.1:6901/ > /dev/null; then
            echo 'O desktop Linux Mint não iniciou corretamente.'
            sudo docker logs linux-mint-web-desktop || true
            exit 1
          fi

          sudo docker exec linux-mint-web-desktop bash -lc '
            apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              firefox neofetch tmate papirus-icon-theme \
              || true
          ' || true

          cloudflared tunnel --url https://127.0.0.1:6901 --no-autoupdate --no-tls-verify > /tmp/cloudflared.log 2>&1 &

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo 'Não foi possível criar o endereço público.'
            cat /tmp/cloudflared.log
            sudo docker logs linux-mint-web-desktop || true
            exit 1
          fi

          {
            echo '## Linux Mint Web Desktop pronto'
            echo ''
            echo "**Link para acessar:** $URL"
            echo ''
            echo '**Usuário:** `kasm_user`'
            echo '**Senha:** a que você definiu ao iniciar o workflow'
            echo ''
            echo 'O desktop inclui uma interface Linux Mint/XFCE, navegador Firefox, terminal e gerenciador de arquivos.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '===================================================='
          echo 'LINUX MINT WEB DESKTOP PRONTO'
          echo "LINK PARA ACESSAR: $URL"
          echo 'USUÁRIO: kasm_user'
          echo 'SENHA: a que você definiu ao iniciar o workflow'
          echo '===================================================='

          sudo docker logs -f linux-mint-web-desktop
